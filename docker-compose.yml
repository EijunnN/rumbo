# Rumbo en una VPS cualquiera:
#
#   cp .env.example .env       # y completa SECRET_KEY_BASE y POSTGRES_PASSWORD
#   docker compose up -d --build
#   docker compose exec app /app/bin/rumbo eval 'Rumbo.Release.gen_project("Mi App")'
#
# La API queda en el puerto 4000 (pon un reverse proxy con TLS delante:
# Caddy/Traefik/nginx). Las migraciones corren solas en cada arranque.

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: rumbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: rumbo
    volumes:
      - rumbo_pgdata:/var/lib/postgresql
    # Sin puertos publicados: solo la app llega a la DB por la red interna.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rumbo -d rumbo"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "/app/bin/migrate && /app/bin/server"
    environment:
      DATABASE_URL: ecto://rumbo:${POSTGRES_PASSWORD}@db/rumbo
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?define SECRET_KEY_BASE en .env (openssl rand -base64 48)}
      PHX_HOST: ${PHX_HOST:-localhost}
      PORT: "4000"
      # CHECK_ORIGIN: "https://miapp.com"   # default: abierto (auth por token)
      # POOL_SIZE: "10"
    ports:
      - "${RUMBO_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD-SHELL", "/app/bin/rumbo rpc ':ok'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  rumbo_pgdata:
